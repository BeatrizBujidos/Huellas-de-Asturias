<section class="py-5 bg-light rounded-4 px-4 px-md-5">

  <div class="text-center mb-5">
    <h2 class="display-4 fw-bold font-display mb-2">¿Quién es quién?</h2>
    <p class="fs-5 fst-italic text-muted fw-light">Descúbrelo</p>
  </div>

  <div class="row g-5">
    @for (artista of artistasVisibles(); track artista.id) {
    <div class="col-12 col-md-6">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
        <div class="row g-0 h-100">
          <!-- Columna imagen -->
          <div class="col-12 d-flex flex-column p-3 bg-white">
            <div class="rounded-3 overflow-hidden retrato-wrapper" style="min-height: 300px;">
              <img [src]="artista.imagen" [alt]="'Retrato de ' + getNombreCompleto(artista)"
                class="w-100 h-100 object-fit-cover retrato-img" />
            </div>

            <div class="text-center mt-3">
              <h3 class="h5 fw-bold mb-0">{{ getNombreCompleto(artista) }}</h3>
            </div>

            <div class="text-center mt-3">
              <a [routerLink]="['/artistas', artista.id]"
                class="btn btn-outline-primary btn-sm rounded-pill px-4 text-decoration-none">
                Ver más <i class="bi bi-arrow-right ms-1"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="d-flex justify-content-center align-items-center gap-4 mt-5">
    <button class="btn btn-outline-primary rounded-circle p-0 nav-btn" [disabled]="!puedeAnterior()"
      (click)="anterior()" aria-label="Anteriores artistas">
      <i class="bi bi-chevron-left"></i>
    </button>

    <div class="d-flex gap-2">
      @for (dot of dotsArray(); track $index; let i = $index) {
      <span class="nav-dot" [class.nav-dot-activo]="i === indicePagina()"></span>
      }
    </div>

    <button class="btn btn-outline-primary rounded-circle p-0 nav-btn" [disabled]="!puedeSiguiente()"
      (click)="siguiente()" aria-label="Siguientes artistas">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <p class="text-center text-muted small mt-2">
    {{ indice() + 1 }}–{{ indice() + artistasVisibles().length }} de {{ total }}
  </p>

</section>
